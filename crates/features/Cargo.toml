[package]
name = "features"
version = "0.1.0"
edition = "2021"

# IMPORTANT: features is PURE — no storage, event-bus, redis, sqlx, or clickhouse deps.
[dependencies]
domain = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
once_cell = "1"
dataplane = { workspace = true }
# Set P P-3.6: external inputs are PIT decimals handed in by the caller. No I/O crate.
rust_decimal = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
