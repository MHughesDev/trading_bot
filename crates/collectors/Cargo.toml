[package]
name = "collectors"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { workspace = true }
dataplane = { workspace = true }
storage = { workspace = true }
# Set P P-3.2: the fundamentals store (dataplane.fundamentals_fact).
sqlx = { workspace = true }
event-bus = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true }
futures-util = "0.3"
rust_decimal = { workspace = true }
rtrb = { workspace = true }
rkyv = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }
sha2 = "0.10"
hex = "0.4"
# Set P P-1.3: config/kraken_archive.toml.
toml = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rust_decimal_macros = { workspace = true }
# Test-only, and deliberately not a real dependency. The forward collector writes
# a `series` name that `observability::silence::FeedExpectation::owns` has to join
# to a `dataplane.forward_series` row, and the two drifted apart unnoticed because
# no crate could see both sides: `storage` and `observability` cannot depend on
# `collectors`, so the assertion can only live here. A dev-dependency pins the
# strings without putting the alarm in the collector's production graph.
observability = { workspace = true }
