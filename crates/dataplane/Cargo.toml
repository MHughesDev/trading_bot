[package]
name = "dataplane"
version = "0.1.0"
edition = "2021"

# L0/L1 data plane of the ML platform spec (docs/ml-platform-context-pack/spec/SPEC.md
# §1–§3): instrument identity, the canonical bar contract, point-in-time
