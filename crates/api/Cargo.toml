[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { workspace = true }
cfg = { workspace = true }
risk = { workspace = true }
execution = { workspace = true }
strategy-engine = { workspace = true }
strategy-runtime = { workspace = true }
strategy-validator = { workspace = true }
storage = { workspace = true }
ui-gateway = { workspace = true }
demand-manager = { workspace = true }
backtest = { workspace = true }
ledger = { workspace = true }
dataplane = { workspace = true }
webfetch = { workspace = true }
skills = { workspace = true }
harness = { workspace = true }
jobs = { workspace = true }
clickhouse = { workspace = true }
async-trait = "0.1"
features = { workspace = true }
model-registry = { workspace = true }
reconciliation = { workspace = true }
# COMP-007. A path dependency rather than a `workspace = true` one: the workspace
# manifest is not this track's file to edit, and a path dependency inside the
# workspace directory makes `crates/monitor` a member anyway. The API only ever
# *reads* the monitor's tables and refreshes the order gate's mirror from them;
# `tbot-monitor` is a separate process and does not run here.
monitor = { path = "../monitor" }
llm = { workspace = true }
mcp-server-lib = { workspace = true }
research = { workspace = true }
research-session = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
# S-3.1: materialising a template's window as parquet. The same pair
# `crates/storage` and `crates/model-registry` already use.
arrow = { workspace = true }
parquet = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
aes-gcm = "0.10"
hex = "0.4"
sha2 = "0.10"
argon2 = "0.5"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
