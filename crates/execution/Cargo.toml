[package]
name = "execution"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { workspace = true }
risk = { workspace = true }
storage = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
async-trait = "0.1"
# Order, fill and paper-state counters (Set E 5.1).
observability = { workspace = true }
# Coinbase ES256 JWT signing (Set E 3.5). `ring` and `base64` are already in the
# workspace lock through rustls and event-bus; no new crate enters the build.
ring = "0.17"
base64 = "0.22"

[features]
# Exposes the non-durable in-memory order journal.  Tests only: installing it
# in a trading process would reinstate the in-memory idempotency that
# migration 0121 replaced.
test-helpers = []

[dev-dependencies]
tokio = { workspace = true }
rust_decimal_macros = { workspace = true }
risk = { workspace = true, features = ["test-helpers"] }
# A dev-dependency on self, which is how a crate turns its own feature on for
# its own test targets and nothing else.  Without it `cargo test -p execution`
# does not compile: `tests/ack_timeout_query.rs` imports
# `journal::memory::MemoryOrderJournal`, which is gated behind `test-helpers`,
# and the feature was only ever switched on by `apps/platform`'s dev-deps — so
# the suite passed under `cargo test --workspace` and failed for anyone running
# this crate alone.  Test targets only: the feature stays off in every build
# that produces a binary.
execution = { path = ".", features = ["test-helpers"] }
