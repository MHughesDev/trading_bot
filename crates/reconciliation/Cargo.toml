[package]
name = "reconciliation"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { workspace = true }
risk = { workspace = true }
execution = { workspace = true }
# T-0.1: the realised series is built as `ledger::neff::ReturnSeries` — the very
# type the ledger persists for a backtest — so "same shape" is a compile-time
# fact rather than a claim two structs make about each other.
ledger = { workspace = true }
# S-7.6: the durable receiving half of a venue halt. A path dependency the way
# `crates/api/Cargo.toml` declares it; `monitor` depends on `domain`, `risk`,
# `storage`-free sqlx and nothing else here, so this closes no cycle.
monitor = { path = "../monitor" }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rust_decimal = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Track 16 made an order journal mandatory: `submit` refuses rather than
# placing a trade the platform cannot reconcile. These tests have no
# database, so they install the in-memory one.
execution = { workspace = true, features = ["test-helpers"] }
