name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --workspace --lib
      # Authentication in crates/api is a BearerToken argument on each handler
      # signature — there is no middleware, so a route is public by omission and
      # the router line for a published route looks identical to a gated one.
      # One handler out of 268 was missing it and answered anonymous callers
      # with the platform's entire data inventory. A source scan is the only
      # reliable reader of 268 signatures; --lib does not run it.
      - name: Every mounted route refuses an anonymous caller
        run: cargo test -p api --test every_mounted_route_refuses_an_anonymous_caller
      # The other half of the same question: a path the desk calls and nothing
      # serves renders as an empty panel, which looks exactly like success.
      - name: Every endpoint the desk calls is served or declared unbuilt
        run: cargo test -p api --test the_desk_calls_routes_that_exist

  platform-invariants:
    name: Platform invariants (static, build-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # docs/ml-platform-context-pack/INVARIANTS.md: every ⛔ test that can be decided
      # from the source tree. A failure here is never waived by editing the allowlist
      # without an ADR.
      - name: Static invariants
        run: cargo test -p invariants --test static_invariants
      - name: Ledger, data-plane and evaluation unit tests
        run: cargo test -p ledger -p dataplane

  platform-invariants-live:
    name: Platform invariants (live Postgres + ClickHouse)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres: migration 0055 needs the extension
        # (ADR-P3-05).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        env:
          CLICKHOUSE_USER: trading
          CLICKHOUSE_PASSWORD: trading
          CLICKHOUSE_DB: trading
        ports: ["8123:8123"]
    env:
      DATABASE_URL: postgres://trading:trading@localhost:5432/trading
      PLATFORM_DB_APP_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ledger chain, state machine, tenancy, campaigns
        run: cargo test -p ledger -- --ignored --test-threads=1
      - name: Schema invariants
        run: cargo test -p invariants --test db_invariants -- --ignored --test-threads=1
      # A route's SQL is not checked against the schema by the type system: the
      # query is a runtime string. /api/evidence/trades selected columns that
      # migration 0026 renamed away, the error was swallowed into a 404, and the
      # route answered "no such run" to every caller for as long as it existed.
      # This PREPAREs every evidence query against the full migration chain.
      - name: Evidence routes query the schema that exists
        run: cargo test -p invariants --test the_evidence_routes_query_the_schema_that_exists -- --ignored --test-threads=1
      # AT-29: a gate threshold cannot be edited in place, a superseding version
      # can be created, and a comparison spanning two profiles is non-comparable.
      - name: Gate profiles are immutable and versioned
        run: cargo test -p backtest --test pg_gate_profile -- --ignored --test-threads=1
      # 0.21 / INV-14: a live serve is logged, and the nightly job recomputes it
      # from the bars through the real point-in-time reader. The unit tests cover
      # the diff logic; only this covers the path between the two.
      - name: Feature consistency diff, end to end
        env:
          CONSISTENCY_E2E_CLICKHOUSE_URL: http://trading:trading@localhost:8123
        run: cargo test -p api --test pg_feature_consistency -- --ignored --test-threads=1

  leakage-suite:
    name: Leakage suite (SPEC 12.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # "Three tests, all in CI" (SPEC 12.5). The causal access guard over the
      # shipped feature set, the random-label test against the production fold
      # geometry, the two frame screens, and the synthetic leak injections that
      # prove each detector catches something. No database, no model, no network.
      - name: Run the leakage suite
        run: cargo test -p features --lib leakage

  kill-switch-drill:
    name: Kill-switch drill (COMP-007 §4.2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://trading:trading@localhost:5432/trading
      MONITOR_TEST_DATABASE_URL: postgres://trading:trading@localhost:5432/trading
      API_TEST_DATABASE_URL: postgres://trading:trading@localhost:5432/trading
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Nobody will trip a global halt on a live book to see whether it works, so
      # without this job the most important path in the platform is the one path
      # never exercised — first exercised on the day it matters, by someone under
      # pressure. This kills a real monitor, lets a real lease lapse, and asserts
      # the order gate refuses afterwards. A drill whose propagation exceeds one
      # cadence fails here, which is what stops the fail-closed design from being
      # a claim.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.8 --no-default-features --features postgres,rustls --locked
      - name: Apply migrations
        run: sqlx migrate run --source migrations
      - name: The pure state machine, dwell, limits, drills and windows
        run: cargo test -p monitor --lib
      - name: The monitor is its own failure domain
        run: cargo test -p monitor --test independence
      - name: Fail-closed drill against a live database
        run: cargo test -p monitor --test fail_closed_drill -- --test-threads=1
      - name: The order gate refuses without a lease
        run: cargo test -p risk --test lease_fails_closed
      - name: No agent token reaches any monitor mutation
        run: cargo test -p api --test monitor_authority -- --test-threads=1

  check-money:
    name: Money safety (no f64 on price/size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run f64 check
        run: cargo xtask check-money-f64

  check-bars-v1-frozen:
    name: Bars schema (nothing writes the retired market_bars)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run market_bars write check
        run: cargo xtask check-bars-v1-frozen

  auditor-suite:
    name: Auditor suite (AGENT-004 AE-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fixture pairs run straight against Gate 0, the leakage lint, the data-grade
      # gate, the revision-pinning check, the prediction-overlap rule, the
      # truncation marker and the final_report validator. No agent, no model, no
      # credential, no network. Target: 100% of violations caught, 0 false
      # rejections on the clean twins.
      - name: Run the auditor fixtures
        run: cargo test -p api --test auditor_suite

  eval-graders:
    name: Eval graders and the non-inferiority gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest pyyaml
      # The graders are the instrument. An instrument nobody checks is a number
      # generator, so the graders, the pass@k/pass^k arithmetic and the paired
      # non-inferiority gate are tested on every PR. No model or credential needed.
      - name: Run grader tests
        run: python -m pytest evals/tests -q
      - name: Dry-run the harness end to end
        run: python evals/runner/run.py --suite noise --seeds 1 --dry-run > /dev/null
      # The post-hoc pipeline decides a threshold from a cost matrix and nothing
      # else (SPEC 11.4, AT-35). A tuned threshold would be an uncounted
      # evaluation trial, so the arithmetic and the absence of a search are both
      # checked on every PR.
      - name: Install post-hoc deps
        run: pip install numpy
      # AT-61 needs torch, xgboost and lightgbm installed and spawns real
      # training processes, so it runs in `resume-bit-identity` below rather than
      # weighing this job down with a 200 MB wheel.
      - name: Run the post-hoc pipeline tests
        run: python -m pytest apps/model-trainer/tests -q --ignore=apps/model-trainer/tests/test_resume_eval.py

  resume-bit-identity:
    name: AT-61 - checkpoint resume is bit-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The frameworks themselves, because AT-61 is a *measurement*: it trains,
      # kills the process and resumes. `checkpoint.BIT_IDENTICAL_FRAMEWORKS` is
      # only as honest as the last run of this job, and a framework it claims but
      # cannot import here fails the test rather than skipping it.
      - name: Install the training frameworks
        run: |
          pip install pytest numpy scikit-learn xgboost lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Measure resume bit-identity per framework
        run: python -m pytest apps/model-trainer/tests/test_resume_eval.py -q

  harness-conformance:
    name: Harness conformance and failure injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Conformance reads the SHIPPED capability profiles, so a profile edit that
      # drifts from Appendix A, drops an enforcement point, or quietly widens the
      # trifecta fails here rather than in production.
      - name: Conformance to the harness guide
        run: cargo test -p harness --test conformance
      # "An agent is production-ready only when it degrades correctly, not just when
      # it succeeds" (guide v3 s6.2). Includes the prompt-injection payloads that
      # assert the policy engine blocks the resulting action.
      - name: Failure injection
        run: cargo test -p harness --test failure_injection
      # A new tool cannot reach a model without a namespace and a risk.
      - name: Tool taxonomy is complete
        run: cargo test -p mcp-server-lib --lib taxonomy

  builders-purity:
    name: builders/features purity (no I/O deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tree
        run: cargo install cargo-tree 2>/dev/null || true
      - name: Check builders has no storage/event-bus deps
        run: |
          BUILDERS_DEPS=$(cargo tree -p builders --edges normal 2>&1 || true)
          for forbidden in sqlx clickhouse redis async-nats event-bus storage; do
            if echo "$BUILDERS_DEPS" | grep -q "$forbidden"; then
              echo "ERROR: builders/ depends on $forbidden (purity violation)"
              exit 1
            fi
          done
          echo "builders/ purity check passed"
      - name: Check features has no storage/event-bus deps
        run: |
          FEATURES_DEPS=$(cargo tree -p features --edges normal 2>&1 || true)
          for forbidden in sqlx clickhouse redis async-nats event-bus storage; do
            if echo "$FEATURES_DEPS" | grep -q "$forbidden"; then
              echo "ERROR: features/ depends on $forbidden (purity violation)"
              exit 1
            fi
          done
          echo "features/ purity check passed"

  agent-sandbox-image:
    name: The run_python sandbox image
    runs-on: ubuntu-latest
    # Nothing built this image. It was written for ADR-0024, repurposed by
    # ADR-0035 and S-8.8, and until this job existed a change that broke it
    # would have been found the first time somebody ran `run_python` on the
    # `full` tier — which is to say, in front of a user.
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f infra/agent-image/Dockerfile -t tbot-agent-sandbox:ci .
      # The acceptance S-8.8 states, checked rather than asserted: no provider
      # credential is present. The executor refuses to start if it finds one, so
      # a run that succeeds is a run that found none.
      - name: It runs a script and returns its result
        run: |
          echo '{"script":"import json,os; open(os.environ[\"RESULT_PATH\"],\"w\").write(json.dumps({\"sharpe\": 1.43}))","payload":{}}' \
            | docker run --rm -i --network none tbot-agent-sandbox:ci > out.json
          cat out.json
          python3 -c "
          import json,sys
          r = json.load(open('out.json'))
          assert r['ok'], r
          assert r['result'] == {'sharpe': 1.43}, r
          print('the sandbox ran a script and returned its result')
          "
      - name: It refuses to start holding a credential
        run: |
          set +e
          echo '{"script":"print(1)"}' \
            | docker run --rm -i --network none -e ANTHROPIC_API_KEY=sk-test tbot-agent-sandbox:ci > refused.txt 2>&1
          status=$?
          set -e
          cat refused.txt
          if [ "$status" -eq 0 ]; then
            echo "ERROR: the sandbox started while holding a provider credential"
            exit 1
          fi
          grep -q "holds no credential" refused.txt
      - name: It refuses to read outside its workspace
        run: |
          echo '{"script":"print(1)","data_path":"../etc/passwd"}' \
            | docker run --rm -i --network none tbot-agent-sandbox:ci > escape.json
          cat escape.json
          python3 -c "
          import json
          r = json.load(open('escape.json'))
          assert r['ok'] is False and r['error'] == 'refused', r
          print('a path outside the workspace is refused')
          "
