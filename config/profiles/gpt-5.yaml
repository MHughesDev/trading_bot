# OpenAI's frontier profile (PROVIDERS track, 2026-10-05; ADR-PROV-03 in
# docs/operations/connect-ai-provider.md).
#
# A user who connects an OpenAI key runs the same loop, the same tools and the same
# budgets as one who connects an Anthropic key. Before this file, every hosted model
# without its own profile borrowed `claude-opus-5` with its model id swapped in;
# that still happens for any OpenAI model not named here, but the manager now
# prefers the frontier profile whose `provider` matches, so an OpenAI model runs
# under this one.
#
# This is a copy of `claude-opus-5.yaml` with four differences, each of which is a
# fact about the provider rather than a judgement:
#
#   provider            "openai", the `llm::Provider` the agent manager builds a
#                       client for. The Claude profile says "anthropic-agent-sdk",
#                       which is the container runtime's name, not a client's.
#   advertised_tokens   400000, GPT-5's window. The effective budget stays at the
#                       Claude profile's 120000: the waste ceiling is about
#                       reasoning quality, not about the size of the window.
#   temperature         0.0 is still asked for. GPT-5-family and o-series models
#                       accept only their default and refuse anything else with a
#                       400; `llm::openai` retries once without the parameter and
#                       remembers the model, so the request is honest about what the
#                       profile wants and the call still goes through.
#   prompt cache        OpenAI's cache is implicit (no breakpoints, no write charge).
#                       Nothing here changes for it: `exposure_scope: session` keeps
#                       the prefix stable, which is what an implicit cache rewards too.
#
# Unmeasured. No scorecard row exists for this profile, and the desk says
# `unmeasured` beside it rather than inheriting the Claude profile's standing.

model_id: "gpt-5"
provider: "openai"
tier: "frontier"

# A5 background/autonomous: research sessions run for hours with no human attached.
# That is why the policy engine treats this agent as unattended by default and gives
# it NARROWER standing permissions than an interactive one — absence of a user
# watching means less authority, never more (guide §14.3).
archetype: "background"

context:
  # GPT-5's window.
  advertised_tokens: 400000
  # Well below the window on purpose. Reasoning quality degrades long before a
  # context is full, and D-11 says the way to spend less is to waste less, not to
  # cut capability — so this is a waste ceiling, not a capability cut.
  effective_budget_tokens: 120000
  reserve_for_output: 16000
  # A tool result larger than this is written to the scratchpad and enters context
  # as a summary plus a handle. 32 KiB is roughly a long file or a few hundred bar
  # rows: enough to reason over, small enough that one greedy call cannot take the
  # step's whole budget.
  max_tool_result_bytes: 32768

tools:
  # The catalogue is 56 tools. This is what may be in front of the model at once.
  # The gap between the two numbers is what dynamic routing closes.
  max_exposed_per_step: 24
  # Routed once per turn and appended to, because tools are the first layer of
  # the cached prefix: dropping one mid-turn invalidates the cache for the
  # system prompt and the whole transcript behind it.
  exposure_scope: session
  # Slots held back so `search_tools` can add a tool without evicting one.
  search_reserve_slots: 4
  schema_style: "rich"
  routing: "dynamic"
  parallel_calls: true

output:
  # OpenAI offers `response_format: json_schema`, but the guide makes constrained
  # decoding a local-tier requirement rather than a universal one, and the frontier
  # path calls tools natively. Off, as on the Claude profile, so a frontier turn
  # sends tools and no grammar.
  constrained_decoding: false
  native_tool_template: true
  temperature_tool_calls: 0.0
  # Appendix A: 2 for frontier. Kept at 3 so every tier shares one retry budget —
  # a ladder that behaves differently per tier is one more thing to reason about,
  # and the third attempt costs one turn.
  max_retries_per_call: 3

orchestration:
  mode: "freeform"
  # DEVIATION from Appendix A (frontier default: 30). Stated per the guide's
  # operating procedure step 6.
  #
  # Appendix A's 30 is calibrated for a task that answers a question. A task here is
  # a multi-hour research session: read data, build features, sweep, study, advance
  # gates, write a report. It makes hundreds of tool calls legitimately, and a
  # 30-step ceiling would truncate honest work mid-funnel.
  #
  # The real guards are the ones that bound cost rather than count: max_usd_per_task,
  # max_wall_clock_s, and the trial counter, which raises the significance bar as the
  # search widens. max_steps is the backstop against a loop, not the budget.
  #
  # No eval justifies 400 specifically; it is a domain judgement, and the eval suite
  # records steps per task so it can be tightened on evidence.
  max_steps: 400
  few_shot_examples: 0
  reflection: true
  # Depth 1 (guide §13.3). A sub-agent that can spawn sub-agents is a cost and
  # reliability bomb, and no eval has argued for more.
  max_subagent_depth: 1
  # Re-planning looks like progress to the barren-step breaker, so it is bounded
  # here instead. Local tiers get one fewer: a 7B that has re-planned twice is
  # not on its way to a third plan that works.
  max_replans_per_run: 3
  # Refinements one run may chain (AGENT-013 §6.5). The chain is a search
  # nobody counted: its selection exposure is the chain length while the ledger
  # says one trial per link, so the cap is what bounds the exposure.
  max_refinements_per_run: 3
  # Consecutive errors from one tool before it leaves exposure for the run.
  tool_breaker_threshold: 3
  # A reflection costs a model call and is not charged to max_steps: a budget
  # that charges for noticing a wrong turn discourages noticing.
  max_reflections_per_run: 3
  # Idle, not elapsed. A run suspended on a forty-minute sweep has been alive for
  # forty minutes and idle for none of them, and the wall clock this replaces could
  # not tell the two apart. Suspended waits do not count.
  idle_timeout_s: 600
  code_execution: "full"

# The trifecta audit (guide §14.1), recorded rather than believed.
trifecta:
  # Research data, the project's own artifacts, the exploration ledger.
  private_data: true
  # Reddit and web-collector text, plus any third-party tool description.
  untrusted_content: true
  # LIVE since 2026-09-14 (ADR-P7-01). Was cut; `web_search` and `fetch_url`
  # restored it deliberately, because a research agent that cannot read a fee
  # schedule or check whether its discovery is a 2011 paper is worth much less.
  outbound_channel: true
  mitigation: >
    All three legs are live. The outbound one is narrowed rather than cut, and the
    narrowing is mechanism rather than care: every destination is decided by
    `webfetch::egress::check`, a pure deny-by-default function over a parsed URL
    and its resolved addresses. Private, loopback, link-local and unique-local
    ranges are refused in both address families, IPv4-mapped included, so cloud
    instance metadata is unreachable; the allow verdict carries the checked
    addresses and the client is pinned to them, closing the DNS-rebinding window;
    redirects are re-checked hop by hop; credentials in a URL are refused rather
    than stripped; and only two tools in the whole catalogue are classified
    Outbound, asserted by name in `the_only_outbound_tools_are_the_two_web_tools`.
    Python skills have no network at all, so they cannot be used to go around any
    of this.
    What this does NOT defend is the agent being persuaded by a page it fetched.
    Fetched content is a distinct type (`webfetch::Untrusted`) with no Display and
    one deliberately long accessor, and it reaches a prompt only inside a fence
    that states it is data; that makes the boundary legible at every call site and
    cannot make a model that ignores the distinction ignore it less. The residual
    risk is accepted knowingly, and publishing still happens only by writing to
    outputs/ and calling deliver, which a human approves.

budgets:
  max_usd_per_task: 25.0
  max_tokens_per_task: 40000000
  # A single call above this asks a human WHATEVER its reversibility.
  # Reversibility is about whether the state can be put back; it says nothing
  # about whether the money can, and a sweep that spends a day of budget and
  # finds nothing is perfectly reversible and perfectly wasted.
  ask_above_usd: 5.0

# AGENT-013 §11. The model drafts the registration and the platform validates it;
# three amendments, which is the platform ceiling.
prereg_authoring: "free"
max_prereg_amendments: 3

# AGENT-013 §11: every workflow. The tier that drafts a pre-registration from
# free text and authors a falsifier without a grammar is the tier that can plan
# a campaign's sequence of structural moves.
workflows:
  - investigate
  - falsify
  - replicate
  - compare
  - diagnose
  - survey
  - optimise

notes: >
  Frontier tier per D-01, for OpenAI-keyed users. Copied from claude-opus-5 and
  changed only where the provider differs (see the header); every deviation from
  Appendix A is the Claude profile's, stated there and restated in the comments
  above. The harness-side discipline here is not a concession to local models:
  tool overload and context rot degrade frontier models too, just later (guide §0.4).
