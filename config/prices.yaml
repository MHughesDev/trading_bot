# The price table AGENT-010 §6 and ADR-D-03 name (Set S task S-2.12).
#
# Read by `harness::adapter::PriceTable`. Rules, each enforced in code:
#
# * Prices are decimal STRINGS of dollars, parsed to integer micro-dollars.
#   Money is never a float on this platform (SC-1); a typo refuses to load.
# * A row is enforced only when `verified_at` is set and no older than 90 days
#   (MAX_PRICE_AGE_DAYS). An unverified or stale row is ABSENT: the dollar cap
#   is not enforced for that model and tokens stay the binding budget. It is
#   never read as a price of zero, because zero is the claim that a run was free.
# * An unlisted cache-read rate is charged at the input rate and an unlisted
#   cache-write rate at twice it (the one-hour TTL premium the Anthropic
#   adapter's breakpoints pay). Both over-state, which is the safe direction for
#   a cap.
#
# Re-verify a row by checking `source_url` and moving `verified_at` to today.

models:
  - model: claude-opus-5
    input_usd_per_mtok: "5.00"
    output_usd_per_mtok: "25.00"
    # 0.1x input for a read; 2x input for a one-hour write (Anthropic's caching
    # multipliers). Stated rather than left to the conservative default so a
    # cached run is not charged ten times its real read cost.
    cache_read_usd_per_mtok: "0.50"
    cache_write_usd_per_mtok: "10.00"
    source_url: https://www.anthropic.com/pricing#api
    verified_at: "2026-09-25"

  # The Anthropic baseline while the platform is in testing (model_policy.rs).
  - model: claude-sonnet-5
    input_usd_per_mtok: "2.00"
    output_usd_per_mtok: "10.00"
    cache_read_usd_per_mtok: "0.20"
    cache_write_usd_per_mtok: "4.00"
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    verified_at: "2026-10-05"

  - model: gpt-4o-mini
    input_usd_per_mtok: "0.15"
    output_usd_per_mtok: "0.60"
    # OpenAI caches automatically and bills a cached read at half the input
    # rate; there is no separate write premium.
    cache_read_usd_per_mtok: "0.075"
    cache_write_usd_per_mtok: "0.15"
    source_url: https://developers.openai.com/api/docs/pricing
    verified_at: "2026-10-05"

# Local inference is priced by the hardware class it runs on, per second
# (ADR-D-03). No row is verified yet: nobody has measured this box's draw, and
# a guessed electricity rate would make `ask_above_usd` fire on a number nobody
# measured. Until a row is added, local runs carry no dollar figure and tokens
# are their binding budget.
hardware: []
