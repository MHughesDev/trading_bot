[package]
name = "platform"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { workspace = true }
cfg = { workspace = true }
observability = { workspace = true }
api = { workspace = true }
jobs = { workspace = true }
risk = { workspace = true }
execution = { workspace = true }
# Used since 2026-09-27 for one thing: `ForwardRecorders::install()` in `main`,
# which attaches reconciliation to the fill stream (T-0.1).
#
# Still **no reconciliation sweep** in this binary, and that remains deliberate.
# The reason is in `crates/reconciliation/src/positions.rs`'s module doc: the only
# broker built here is `PaperTradingEngine::multi_asset_broker()`, whose
# `query_positions` returns the same `engine.positions(class)` the internal book
# would be read from, so a sweep over that pair cannot diverge and would log
# "reconciliation OK" for a check that cannot fail. The sweep belongs beside the
# first broker that talks to something outside this process.
reconciliation = { workspace = true }
strategy-runtime = { workspace = true }
# Set U Phase 4: v3 deployments run on the one strategy engine (live_runner.rs).
strategy-engine = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
storage = { workspace = true }
ui-gateway = { workspace = true }
demand-manager = { workspace = true }
backtest = { workspace = true }
ledger = { workspace = true }
ed25519-dalek = "2"
hex = "0.4"
model-registry = { workspace = true }
event-bus = { workspace = true }
collectors = { workspace = true }
dataplane = { workspace = true }
async-nats = { workspace = true }
rtrb = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
async-trait = "0.1"
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# L2 book feed (book_feed.rs) — its own venue WebSocket, separate from the
# trade pipelines in collectors.
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
dashmap = { workspace = true }
mimalloc = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
# The end-to-end fill test installs the non-durable in-memory order journal and
# builds ApprovedOrders directly where it needs to drive one stage in isolation.
execution = { workspace = true, features = ["test-helpers"] }
risk = { workspace = true, features = ["test-helpers"] }
