[project]
name = "tbot"
version = "0.1.0"
description = "The research agent's only route to the platform (AGENT-002)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
tbot = "tbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
